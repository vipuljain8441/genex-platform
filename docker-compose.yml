services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace/genex-platform
    command: sleep infinity
    volumes:
      - .:/workspace
      - backend_venv:/workspace/genex-platform/backend/.venv
      - frontend_node_modules:/workspace/genex-platform/frontend/node_modules
      - sandbox_sessions:/sessions
    environment:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      STORE_BACKEND: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/genex
      LLM_PROVIDER: openai_compatible
      LLM_API_BASE: http://ollama:11434/v1
      LLM_API_KEY: ollama
      LLM_MODEL: qwen2.5-coder:0.5b
      ALLOW_ORIGINS: http://${PUBLIC_HOST:-13.206.88.254}:3000,http://localhost:3000
      ALLOW_ORIGIN_REGEX: ^https?://${PUBLIC_HOST_REGEX:-13\.206\.88\.254}(?::\d+)?$
      APP_BASE_URL: http://${PUBLIC_HOST:-13.206.88.254}:3000
      NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-13.206.88.254}:8000
      NEXT_PUBLIC_WS_URL: ws://${PUBLIC_HOST:-13.206.88.254}:8000
      NEXT_PUBLIC_SANDBOX_URL: http://${PUBLIC_HOST:-13.206.88.254}:8080
      SANDBOX_SESSIONS_DIR: /sessions
      SANDBOX_VSCODE_ROOT: /home/coder/sessions
      SANDBOX_URL: http://${PUBLIC_HOST:-13.206.88.254}:8080
      SANDBOX_SYNC_URL: http://code-server:8081
    ports:
      - "3000:3000"
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      code-server:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d genex"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  code-server:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    user: "1000"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - sandbox_sessions:/home/coder/sessions
      - /tmp/genex-sessions:/tmp/genex-sessions
    environment:
      PASSWORD: ""
      SYNC_PORT: "8081"
      GENEX_REPORT_URL: http://workspace:8000
    command: >-
      --bind-addr 0.0.0.0:8080
      --auth none
      --disable-telemetry
      --disable-update-check
      --disable-workspace-trust

volumes:
  postgres_data:
  backend_venv:
  frontend_node_modules:
  ollama_data:
  sandbox_sessions:

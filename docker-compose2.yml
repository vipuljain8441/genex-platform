services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: genex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d genex"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_bedrock_data:/var/lib/postgresql/data

  code-server:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    user: "1000"
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - sandbox_sessions:/home/coder/sessions
    environment:
      PASSWORD: ""
      SYNC_PORT: "8081"
      GENEX_REPORT_URL: http://backend:8000
    command: >-
      --bind-addr 0.0.0.0:8080
      --auth none
      --disable-telemetry
      --disable-update-check
      --disable-workspace-trust
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      code-server:
        condition: service_healthy
    environment:
      STORE_BACKEND: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/genex
      LLM_TYPE: ${LLM_TYPE:-bedrock}
      LLM_PROVIDER: ${LLM_PROVIDER:-bedrock}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      LLM_MODEL: ${LLM_MODEL:-global.anthropic.claude-sonnet-4-6}
      BEDROCK_REGION: ${BEDROCK_REGION:-ap-south-1}
      BEDROCK_AUTH_MODE: ${BEDROCK_AUTH_MODE:-iam}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ALLOW_ORIGIN_REGEX: ^https?://([a-zA-Z0-9-]+\.)*[a-zA-Z0-9-]+(?::\d+)?$
      LOG_LEVEL: INFO
      APP_BASE_URL: http://${PUBLIC_HOST:-localhost}:3000
      SANDBOX_SESSIONS_DIR: /sessions
      SANDBOX_VSCODE_ROOT: /home/coder/sessions
      SANDBOX_URL: http://${PUBLIC_HOST:-localhost}:8080
      SANDBOX_SYNC_URL: http://code-server:8081
    ports:
      - "8000:8000"
    volumes:
      - sandbox_sessions:/sessions
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:8000
        NEXT_PUBLIC_WS_URL: ws://${PUBLIC_HOST:-localhost}:8000
        NEXT_PUBLIC_SANDBOX_URL: http://${PUBLIC_HOST:-localhost}:8080
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:8000
      NEXT_PUBLIC_WS_URL: ws://${PUBLIC_HOST:-localhost}:8000
      NEXT_PUBLIC_SANDBOX_URL: http://${PUBLIC_HOST:-localhost}:8080
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  postgres_bedrock_data:
  sandbox_sessions:
